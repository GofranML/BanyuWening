[program:banyuwening-ws]
process_name=%(program_name)s
command=php /var/www/banyuwening/laravel-app/artisan ws:serve --host=0.0.0.0 --port=8081
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/banyuwening/laravel-app/storage/logs/ws-server.log
stopwaitsecs=10
